name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Each data product declares its dependencies next to its tests; the
      # gate itself installs nothing, so the same command runs offline locally.
      - name: Install data product test dependencies
        shell: bash
        run: |
          shopt -s nullglob
          for req in output/*/04_code/requirements.txt; do python -m pip install -q -r "$req"; done
      - name: Unit tests and data product tests
        run: python tools/leftshift/checks.py tests
      # Same commands lefthook runs before the commit, here against the base
      # branch so they cannot be skipped with --no-verify.
      - name: data/raw is read-only
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python tools/leftshift/checks.py raw --base "origin/$BASE_REF"
      - name: No PII column names outside data/raw
        run: python tools/leftshift/checks.py pii --rev HEAD
